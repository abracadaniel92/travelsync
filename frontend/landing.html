<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TravelSync - Sync Your Travel Documents</title>
    <link rel="icon" type="image/png" href="/static/images/logo2.png">
    <link rel="apple-touch-icon" href="/static/images/logo2.png">
    <link rel="stylesheet" href="/static/css/style.css?v=20">
</head>
<body>
    <div class="landing-page-simple">
        <!-- Header with Logo and Sign In -->
        <header class="landing-header-simple">
            <div class="landing-header-content-simple">
                <a href="/" class="landing-logo-link">
                    <img src="/static/images/logo2.png" alt="TravelSync" class="landing-logo">
                </a>
                <a href="/login" class="btn-sign-in-simple">Sign In</a>
            </div>
        </header>

        <!-- Hero Section with Image Background and Text Overlay -->
        <section class="landing-hero-simple">
            <div class="landing-hero-image-wrapper">
                <img src="/static/images/hero.png" alt="TravelSync App" class="landing-hero-bg">
            </div>
            <div class="landing-hero-text-overlay">
                <h1 class="landing-hero-title-simple"><span class="title-travel">Travel</span><span class="title-sync">Sync</span></h1>
                <p class="landing-description-simple">
                    TravelSync automatically extracts travel information from your documents and syncs them to your calendar. Upload tickets, boarding passes, or hotel reservations and let AI do the rest. Never miss a flight or hotel check-in again.
                </p>
            </div>
        </section>

        <!-- Footer -->
        <footer class="landing-footer-simple">
            <p>© 2026 Goce Mojsoski. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
